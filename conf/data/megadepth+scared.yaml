_target_: ripepp.data.datasets.dataset_combinator.DatasetCombinator
mode: custom
weights:
  - 0.2
  - 0.8
datasets:
  - _target_: ripepp.data.datasets.scared.SCARED
    # Path to dataset root (should contain train/, val/, test/ with dataset_* folders)
    root: ${oc.env:DATA_DIR}/SCARED
    # Dataset stage
    stage: train
    # Distance between frames to form a pair (e.g., pair frame i with frame i+N)
    frame_distance: 60
    # If True, return only positive pairs. If False, interleave positive/negative pairs.
    positive_only: True
    # Transforms
    transforms:
      _target_: ripepp.data.data_transforms.Compose
      transforms:
        - _target_: ripepp.data.data_transforms.Normalize
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
        # Geometric augmentation (mild for videos)
        - _target_: ripepp.data.data_transforms.RandomAffine
          degrees: 30  # Reduced from 30 for video
          translate: [10, 10]
          scale: 0.1
        - _target_: ripepp.data.data_transforms.ResizeAndPad
          target_size_longer_side: 560
  - _target_: ripepp.data.datasets.disk_megadepth.DISK_Megadepth
    root: ${oc.env:DATA_DIR}/disk-data
    stage: train
    max_scene_size: 10000
    positive_only: True
    transforms:
      _target_: ripepp.data.data_transforms.Compose
      transforms:
        - _target_: ripepp.data.data_transforms.Normalize
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
        - _target_: ripepp.data.data_transforms.ResizeAndPad
          target_size_longer_side: 560