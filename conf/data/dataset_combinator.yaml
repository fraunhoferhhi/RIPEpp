_target_: ripepppp.data.datasets.dataset_combinator.DatasetCombinator
mode: uniform
datasets:
  - _target_: ripepp.data.datasets.acdc.ACDC
    root: ${oc.env:DATA_DIR}/ACDC
    stage: train
    condition: all
    transforms:
      _target_: ripepp.data.data_transforms.Compose
      transforms:
        - _target_: ripepp.data.data_transforms.Normalize
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
        - _target_: ripepp.data.data_transforms.Crop # to remove the car hood from some images
          crop_height: 896
          crop_width: 1920
        - _target_: ripepp.data.data_transforms.ResizeAndPadWithHomography
          target_size_longer_side: 560
  - _target_: ripepp.data.datasets.disk_megadepth.DISK_Megadepth
    root: ${oc.env:DATA_DIR}/disk-data
    stage: train
    max_scene_size: 10000
    transforms:
      _target_: ripepp.data.data_transforms.Compose
      transforms:
        - _target_: ripepp.data.data_transforms.Normalize
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
        - _target_: ripepp.data.data_transforms.ResizeAndPadWithHomography
          target_size_longer_side: 560
  - _target_: ripepp.data.datasets.oxford.Oxford
    root: ${oc.env:DATA_DIR}/roxford5k
    stage: train
    modes:
      - easy
    transforms:
      _target_: ripepp.data.data_transforms.Compose
      transforms:
        - _target_: ripepp.data.data_transforms.Normalize
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
        - _target_: ripepp.data.data_transforms.ResizeAndPadWithHomography
          target_size_longer_side: 560
  - _target_: ripepp.data.datasets.paris.Paris
    root: ${oc.env:DATA_DIR}/rparis6k
    stage: train
    modes:
      - easy
    transforms:
      _target_: ripepp.data.data_transforms.Compose
      transforms:
        - _target_: ripepp.data.data_transforms.Normalize
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
        - _target_: ripepp.data.data_transforms.ResizeAndPadWithHomography
          target_size_longer_side: 560
  - _target_: ripepp.data.datasets.tokyo_query_v3.TokyoQueryV3
    root: ${oc.env:DATA_DIR}/Tokyo_Query_V3
    stage: train
    transforms:
      _target_: ripepp.data.data_transforms.Compose
      transforms:
        - _target_: ripepp.data.data_transforms.Normalize
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
        - _target_: ripepp.data.data_transforms.ResizeAndPadWithHomography
          target_size_longer_side: 560
